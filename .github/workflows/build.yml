name: Build and Publish Caddy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 10 * *'  # Monthly on the 10th at 15:00 UTC
  workflow_dispatch:

# Coalesce builds: a burst of plugin merges firing workflow_dispatch
# collapses into one run, which is fine because xcaddy resolves every
# plugin's main fresh anyway — the latest run always sees all updates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get latest Caddy version
        id: version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found Caddy version: $VERSION"

  build:
    needs: get-version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      deb_version: ${{ steps.deb-version.outputs.version }}
    permissions:
      contents: write  # GitHub Release assets for .deb packages
      packages: write
      id-token: write  # keyless cosign via Actions OIDC
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: itdwgmbh

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        # Latest stable toolchain for the image binaries. The go.mod `go`
        # line is the language minimum only — Dependabot does not bump it.
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build sidecar binaries
        run: |
          for arch in amd64 arm64; do
            for bin in healthcheck cert-sanity; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' \
                -o ${bin}-${arch} ./cmd/${bin}
            done
          done

      - name: Configure private Go modules
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install xcaddy
        # `go tool xcaddy` rebuilds xcaddy under the caller's GOOS/GOARCH, which
        # breaks the cross-compile loop below. Install a host-native binary
        # once from the version pinned in go.mod (Dependabot still updates it).
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy

      - name: Cross-compile Caddy binaries
        env:
          CADDY_VERSION: ${{ needs.get-version.outputs.version }}
          GOPRIVATE: github.com/itdwgmbh/*
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch xcaddy build ${CADDY_VERSION} \
              --with github.com/caddy-dns/acmedns \
              --with github.com/itdwgmbh/caddy-oidc \
              --with github.com/itdwgmbh/caddy-ratelimit \
              --with github.com/itdwgmbh/caddy-s3proxy \
              --replace github.com/google/cel-go=github.com/google/cel-go@v0.28.1
            mv caddy caddy-linux-${arch}
          done

      - name: Format Caddyfile baked into the image
        # Cosmetic; avoids fmt warnings at container startup regardless of
        # what's committed to the repo.
        run: ./caddy-linux-amd64 fmt --overwrite Caddyfile

      - name: Compute deb package version
        id: deb-version
        env:
          CADDY_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          # Unique per build so apt can distinguish plugin rebuilds of the
          # same upstream Caddy tag. Example: 2.11.2+itdw.42
          VER="${CADDY_VERSION#v}+itdw.${{ github.run_number }}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Deb version: ${VER}"

      - name: Build Debian packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          ./scripts/build-deb.sh "${{ steps.deb-version.outputs.version }}" dist/deb
          ls -la dist/deb/

      - name: Upload deb packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: caddy-debs
          path: dist/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish deb packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CADDY_VERSION: ${{ needs.get-version.outputs.version }}
          DEB_VERSION: ${{ steps.deb-version.outputs.version }}
        run: |
          replace_debs() {
            local tag="$1"
            # Drop previous .deb assets so unique +itdw.N filenames do not accumulate.
            gh release view "${tag}" --json assets -q '.assets[].name' 2>/dev/null \
              | while read -r asset; do
                  [[ ${asset} == *.deb ]] || continue
                  gh release delete-asset "${tag}" "${asset}" --yes || true
                done
            gh release upload "${tag}" dist/deb/*.deb
          }

          # Rolling release always holding the latest debs (aptly-job target).
          if ! gh release view packages >/dev/null 2>&1; then
            gh release create packages \
              --title "Caddy packages (rolling)" \
              --notes "Rolling .deb packages for apt.itinfra.cloud and manual install. Assets are replaced on every successful main build." \
              --latest=false
          fi
          replace_debs packages

          # Versioned release for the upstream Caddy tag.
          TAG="${CADDY_VERSION}"
          NOTES="IT-DW Caddy ${CADDY_VERSION} (package ${DEB_VERSION})

          Same binary as \`ghcr.io/itdwgmbh/caddy:${CADDY_VERSION}\`.
          Modules: acmedns, caddy-oidc, caddy-ratelimit, caddy-s3proxy."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            replace_debs "${TAG}"
          else
            gh release create "${TAG}" dist/deb/*.deb \
              --title "Caddy ${CADDY_VERSION}" \
              --notes "${NOTES}" \
              --latest=false
          fi

      - name: Set up QEMU
        # Emulates arm64 for the Dockerfile's `apk add` RUN step; the Go/caddy
        # binaries are already cross-compiled natively above.
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.get-version.outputs.version }},enable=${{ needs.get-version.outputs.version != '' }}
            type=sha
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log into registry ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-results.sarif
